<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs></defs>

  <!-- Subgraph: Unbound Value Lives In Proof Payload -->
  <rect fill="#1e293b" fill-opacity="0.3" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4,4"
     x="50" y="40" width="420" height="430" rx="12" />
  <text font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1"
     x="260" y="75" text-anchor="middle">UNBOUND VALUE LIVES IN PROOF PAYLOAD</text>

  <!-- Node: Jolt -->
  <g transform="translate(110, 110)">
    <rect fill="#1e293b" stroke="#c084fc" stroke-width="2" width="300" height="90" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="16" fill="#f8fafc" font-weight="600"
       x="150" y="32" text-anchor="middle">Jolt</text>
    <text font-family="JetBrains Mono, monospace" font-size="14" fill="#cbd5e1"
       x="150" y="56" text-anchor="middle">opening_claims</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94a3b8" font-style="italic"
       x="150" y="76" text-anchor="middle">linear system</text>
  </g>

  <!-- Node: Nexus -->
  <g transform="translate(110, 230)">
    <rect fill="#1e293b" stroke="#c084fc" stroke-width="2" width="300" height="90" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="16" fill="#f8fafc" font-weight="600"
       x="150" y="32" text-anchor="middle">Nexus</text>
    <text font-family="JetBrains Mono, monospace" font-size="14" fill="#cbd5e1"
       x="150" y="56" text-anchor="middle">claimed_sum</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94a3b8" font-style="italic"
       x="150" y="76" text-anchor="middle">linear</text>
  </g>

  <!-- Node: Ceno -->
  <g transform="translate(110, 350)">
    <rect fill="#1e293b" stroke="#c084fc" stroke-width="2" width="300" height="90" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="16" fill="#f8fafc" font-weight="600"
       x="150" y="32" text-anchor="middle">Ceno</text>
    <text font-family="JetBrains Mono, monospace" font-size="14" fill="#cbd5e1"
       x="150" y="56" text-anchor="middle">out_evals</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94a3b8" font-style="italic"
       x="150" y="76" text-anchor="middle">linear + product</text>
  </g>

  <!-- Subgraph: Unbound Value Passed As Statement Parameter -->
  <rect fill="#1e293b" fill-opacity="0.3" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,4"
     x="530" y="40" width="420" height="430" rx="12" />
  <text font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1"
     x="740" y="75" text-anchor="middle">UNBOUND VALUE PASSED AS STATEMENT PARAMETER</text>

  <!-- Node: Cairo-M -->
  <g transform="translate(590, 110)">
    <rect fill="#1e293b" stroke="#fcd34d" stroke-width="2" width="300" height="90" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="16" fill="#f8fafc" font-weight="600"
       x="150" y="32" text-anchor="middle">Cairo-M</text>
    <text font-family="JetBrains Mono, monospace" font-size="14" fill="#cbd5e1"
       x="150" y="56" text-anchor="middle">public_data</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94a3b8" font-style="italic"
       x="150" y="76" text-anchor="middle">rational system</text>
  </g>

  <!-- Node: Expander -->
  <g transform="translate(590, 230)">
    <rect fill="#1e293b" stroke="#fcd34d" stroke-width="2" width="300" height="90" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="16" fill="#f8fafc" font-weight="600"
       x="150" y="32" text-anchor="middle">Expander</text>
    <text font-family="JetBrains Mono, monospace" font-size="14" fill="#cbd5e1"
       x="150" y="56" text-anchor="middle">public_input / claimed_v</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94a3b8" font-style="italic"
       x="150" y="76" text-anchor="middle">linear</text>
  </g>

  <!-- Node: Binius64 -->
  <g transform="translate(590, 350)">
    <rect fill="#1e293b" stroke="#fcd34d" stroke-width="2" width="300" height="90" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="16" fill="#f8fafc" font-weight="600"
       x="150" y="32" text-anchor="middle">Binius64</text>
    <text font-family="JetBrains Mono, monospace" font-size="14" fill="#cbd5e1"
       x="150" y="56" text-anchor="middle">public witness</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94a3b8" font-style="italic"
       x="150" y="76" text-anchor="middle">linear</text>
  </g>
</svg>
