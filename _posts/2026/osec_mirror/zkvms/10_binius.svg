<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <defs>
    <marker id="arrow-yellow" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0,-4 L 10,0 L 0,4 Z" fill="#fbbf24" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0,-4 L 10,0 L 0,4 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-red" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0,-4 L 10,0 L 0,4 Z" fill="#ef4444" />
    </marker>
    <marker id="arrow-lime" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0,-4 L 10,0 L 0,4 Z" fill="#a3e635" />
    </marker>
  </defs>

  <rect fill="#1e293b" fill-opacity="0.3" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,4"
        x="40" y="40" width="340" height="540" rx="12" />
  <text font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1" text-transform="uppercase"
        x="60" y="65">TRANSCRIPT STATE</text>

  <rect fill="#450a0a" fill-opacity="0.2" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"
        x="420" y="40" width="740" height="120" rx="12" />
  <text font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ef4444" letter-spacing="1" text-transform="uppercase"
        x="440" y="65">NOT IN TRANSCRIPT</text>

  <rect fill="#1e293b" fill-opacity="0.3" stroke="#a3e635" stroke-width="2" stroke-dasharray="6,4"
        x="420" y="190" width="740" height="390" rx="12" />
  <text font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1" text-transform="uppercase"
        x="440" y="215">VERIFICATION FLOW</text>


  <g fill="none" stroke-width="2.5" stroke-linejoin="round">
    
    <path d="M 210,140 L 210,190" stroke="#fbbf24" marker-end="url(#arrow-yellow)" />
    <path d="M 210,250 L 210,380" stroke="#fbbf24" marker-end="url(#arrow-yellow)" />

    <path d="M 790,130 L 790,230" stroke="#ef4444" stroke-dasharray="6,4" marker-end="url(#arrow-red)" />

    <path d="M 360,105 H 500 V 245 H 540" stroke="#38bdf8" marker-end="url(#arrow-cyan)" />
    
    <path d="M 360,220 H 470 V 275 H 540" stroke="#38bdf8" marker-end="url(#arrow-cyan)" />

    <path d="M 360,125 H 450 V 395 H 540" stroke="#38bdf8" marker-end="url(#arrow-cyan)" />

    <path d="M 360,410 H 540" stroke="#38bdf8" marker-end="url(#arrow-cyan)" />

    <path d="M 790,290 L 790,380" stroke="#a3e635" marker-end="url(#arrow-lime)" />

    <path d="M 790,440 L 790,490" stroke="#a3e635" marker-end="url(#arrow-lime)" />

    <path d="M 540,520 H 360" stroke="#a3e635" stroke-dasharray="6,4" marker-end="url(#arrow-lime)" />

  </g>

  <text font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5" fill="#ef4444" x="800" y="180" text-anchor="start" dominant-baseline="middle">UNBOUND</text>

  <text font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="14" fill="#38bdf8" x="508" y="175" text-anchor="start" dominant-baseline="middle">r<tspan dy="3" font-size="11">j</tspan></text>

  <text font-family="JetBrains Mono, monospace" font-size="12" fill="#38bdf8" x="415" y="210" text-anchor="middle" dominant-baseline="middle">inout_eval</text>

  <text font-family="Georgia, serif" font-style="italic" font-weight="bold" font-size="16" fill="#38bdf8" x="442" y="260" text-anchor="end" dominant-baseline="middle">γ</text>

  <text font-family="JetBrains Mono, monospace" font-size="12" fill="#38bdf8" x="450" y="400" text-anchor="middle" dominant-baseline="middle">batch_coeff</text>

  <text font-family="JetBrains Mono, monospace" font-size="13" fill="#a3e635" x="800" y="335" text-anchor="start" dominant-baseline="middle">public_eval</text>

  <text font-family="JetBrains Mono, monospace" font-size="13" fill="#a3e635" x="800" y="465" text-anchor="start" dominant-baseline="middle">sum</text>


  <g transform="translate(60, 80)">
    <rect fill="#1e293b" stroke="#fbbf24" stroke-width="2" width="300" height="60" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500" x="150" y="22" text-anchor="middle" dominant-baseline="middle">First Sumcheck</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94a3b8" x="150" y="42" text-anchor="middle" dominant-baseline="middle">
      (produces <tspan font-family="Georgia, serif" font-style="italic" font-weight="bold" fill="#38bdf8">γ, r</tspan><tspan font-family="Georgia, serif" font-style="italic" font-weight="bold" fill="#38bdf8" dy="3" font-size="11">j</tspan><tspan font-family="Georgia, serif" font-style="italic" font-weight="bold" fill="#38bdf8" dy="-3">, r</tspan><tspan font-family="Georgia, serif" font-style="italic" font-weight="bold" fill="#38bdf8" dy="3" font-size="11">s</tspan><tspan dy="-3">)</tspan>
    </text>
  </g>

  <g transform="translate(60, 190)">
    <rect fill="#1e293b" stroke="#fbbf24" stroke-width="2" width="300" height="60" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500" x="150" y="31" text-anchor="middle" dominant-baseline="middle">Sample <tspan font-family="JetBrains Mono, monospace" fill="#38bdf8">inout_eval_point</tspan></text>
  </g>

  <g transform="translate(60, 380)">
    <rect fill="#1e293b" stroke="#fbbf24" stroke-width="2" width="300" height="60" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500" x="150" y="31" text-anchor="middle" dominant-baseline="middle">Sample <tspan font-family="JetBrains Mono, monospace" fill="#38bdf8">batch_coeff</tspan></text>
  </g>

  <g transform="translate(540, 70)">
    <rect fill="#450a0a" stroke="#ef4444" stroke-width="2" width="500" height="60" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#fca5a5" font-weight="500" x="250" y="22" text-anchor="middle" dominant-baseline="middle">
      <tspan fill="#ef4444" font-weight="700">BUG:</tspan> <tspan font-family="JetBrains Mono, monospace" font-size="14.5" fill="#fca5a5">public_input</tspan>
    </text>
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#fca5a5" font-weight="500" x="250" y="42" text-anchor="middle" dominant-baseline="middle">not yet absorbed in transcript!</text>
  </g>

  <g transform="translate(540, 230)">
    <rect fill="#1e293b" stroke="#a3e635" stroke-width="2" width="500" height="60" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500" x="250" y="31" text-anchor="middle" dominant-baseline="middle">
      <tspan font-family="JetBrains Mono, monospace" fill="#e2e8f0">public_eval = MLE(</tspan>
      <tspan font-family="JetBrains Mono, monospace" fill="#fca5a5">public_input</tspan>
      <tspan font-family="JetBrains Mono, monospace" fill="#e2e8f0">, </tspan>
      <tspan font-family="Georgia, serif" font-style="italic" font-weight="bold" fill="#38bdf8">r</tspan>
      <tspan font-family="Georgia, serif" font-style="italic" font-weight="bold" fill="#38bdf8" dy="3" font-size="11">j</tspan>
      <tspan font-family="JetBrains Mono, monospace" fill="#e2e8f0" dy="-3">, inout_eval_point)</tspan>
    </text>
  </g>

  <g transform="translate(540, 380)">
    <rect fill="#1e293b" stroke="#a3e635" stroke-width="2" width="500" height="60" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500" x="250" y="31" text-anchor="middle" dominant-baseline="middle">
      <tspan font-family="JetBrains Mono, monospace" fill="#e2e8f0">sum = </tspan>
      <tspan font-family="Georgia, serif" font-style="italic" font-weight="bold" fill="#38bdf8">γ</tspan>
      <tspan font-family="JetBrains Mono, monospace" fill="#e2e8f0"> + </tspan>
      <tspan font-family="JetBrains Mono, monospace" fill="#38bdf8">batch_coeff</tspan>
      <tspan font-family="JetBrains Mono, monospace" fill="#e2e8f0"> * </tspan>
      <tspan font-family="JetBrains Mono, monospace" fill="#a3e635">public_eval</tspan>
    </text>
  </g>

  <g transform="translate(540, 490)">
    <rect fill="#1e293b" stroke="#a3e635" stroke-width="2" width="500" height="60" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500" x="250" y="22" text-anchor="middle" dominant-baseline="middle">Second Sumcheck</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94a3b8" x="250" y="42" text-anchor="middle" dominant-baseline="middle">(verifies batched sum)</text>
  </g>

</svg>
