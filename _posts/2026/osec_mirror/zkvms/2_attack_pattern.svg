<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1550" width="800" height="1550">
  <defs>
    <marker id="arrow-yellow" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0,-4 L 10,0 L 0,4 Z" fill="#fbbf24" />
    </marker>
    <marker id="arrow-blue" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0,-4 L 10,0 L 0,4 Z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-purple" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0,-4 L 10,0 L 0,4 Z" fill="#c084fc" />
    </marker>
    <marker id="arrow-pink" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0,-4 L 10,0 L 0,4 Z" fill="#f472b6" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0,-4 L 10,0 L 0,4 Z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Subgraph: Step 1 -->
  <rect fill="#1e293b" fill-opacity="0.3" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"
     x="200" y="40" width="400" height="310" rx="12" />
  <text font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1"
     x="220" y="65">STEP 1: IDENTIFY UNBOUND VALUES</text>

  <!-- Subgraph: Step 2 -->
  <rect fill="#1e293b" fill-opacity="0.3" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"
     x="200" y="390" width="400" height="310" rx="12" />
  <text font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1"
     x="220" y="415">STEP 2: TRACE TO EQUATIONS</text>

  <!-- Subgraph: Step 3 -->
  <rect fill="#1e293b" fill-opacity="0.3" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"
     x="200" y="740" width="400" height="310" rx="12" />
  <text font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1"
     x="220" y="765">STEP 3: DERIVE CONSTRAINTS</text>

  <!-- Subgraph: Step 4 -->
  <rect fill="#1e293b" fill-opacity="0.3" stroke="#334155" stroke-width="2" stroke-dasharray="6,4"
     x="200" y="1090" width="400" height="400" rx="12" />
  <text font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1"
     x="220" y="1115">STEP 4: SOLVE AND FORGE</text>

  <!-- Arrows -->
  <g fill="none" stroke-width="2.5">
    <path d="M 400,150 V 180" stroke="#fbbf24" marker-end="url(#arrow-yellow)" />
    <path d="M 400,240 V 270" stroke="#fbbf24" marker-end="url(#arrow-yellow)" />
    <path d="M 400,330 V 440" stroke="#38bdf8" marker-end="url(#arrow-cyan)" />
    <path d="M 400,500 V 530" stroke="#60a5fa" marker-end="url(#arrow-blue)" />
    <path d="M 400,590 V 620" stroke="#60a5fa" marker-end="url(#arrow-blue)" />
    <path d="M 400,680 V 790" stroke="#38bdf8" marker-end="url(#arrow-cyan)" />
    <path d="M 400,850 V 880" stroke="#c084fc" marker-end="url(#arrow-purple)" />
    <path d="M 400,940 V 970" stroke="#c084fc" marker-end="url(#arrow-purple)" />
    <path d="M 400,1030 V 1140" stroke="#38bdf8" marker-end="url(#arrow-cyan)" />
    <path d="M 400,1200 V 1230" stroke="#f472b6" marker-end="url(#arrow-pink)" />
    <path d="M 400,1290 V 1320" stroke="#f472b6" marker-end="url(#arrow-pink)" />
    <path d="M 400,1380 V 1410" stroke="#f472b6" marker-end="url(#arrow-pink)" />
  </g>

  <!-- Step 1 Nodes -->
  <g transform="translate(240, 90)">
    <rect fill="#0f172a" stroke="#fbbf24" stroke-width="2" width="320" height="60" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500"
       x="160" y="30" text-anchor="middle" dominant-baseline="middle">Find prover-controlled values</text>
  </g>
  <g transform="translate(240, 180)">
    <rect fill="#0f172a" stroke="#fbbf24" stroke-width="2" width="320" height="60" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500"
       x="160" y="22" text-anchor="middle" dominant-baseline="middle">Check: are they in transcript</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500"
       x="160" y="42" text-anchor="middle" dominant-baseline="middle">before challenges?</text>
  </g>
  <g transform="translate(240, 270)">
    <rect fill="#0f172a" stroke="#fbbf24" stroke-width="2" width="320" height="60" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500"
       x="160" y="30" text-anchor="middle" dominant-baseline="middle">If not ➔ candidate for attack</text>
  </g>

  <!-- Step 2 Nodes -->
  <g transform="translate(240, 440)">
    <rect fill="#0f172a" stroke="#60a5fa" stroke-width="2" width="320" height="60" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500"
       x="160" y="22" text-anchor="middle" dominant-baseline="middle">How does value <tspan font-family="Georgia, serif" font-style="italic" font-weight="bold" fill="#60a5fa">V</tspan> affect</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500"
       x="160" y="42" text-anchor="middle" dominant-baseline="middle">verification?</text>
  </g>
  <g transform="translate(240, 530)">
    <rect fill="#0f172a" stroke="#60a5fa" stroke-width="2" width="320" height="60" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500"
       x="160" y="22" text-anchor="middle" dominant-baseline="middle">Write verification equation</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500"
       x="160" y="42" text-anchor="middle" dominant-baseline="middle">in terms of <tspan font-family="Georgia, serif" font-style="italic" font-weight="bold" fill="#60a5fa">V</tspan></text>
  </g>
  <g transform="translate(240, 620)">
    <rect fill="#0f172a" stroke="#60a5fa" stroke-width="2" width="320" height="60" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500"
       x="160" y="22" text-anchor="middle" dominant-baseline="middle">Determine: is equation</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500"
       x="160" y="42" text-anchor="middle" dominant-baseline="middle">linear/low-degree in <tspan font-family="Georgia, serif" font-style="italic" font-weight="bold" fill="#60a5fa">V</tspan>?</text>
  </g>

  <!-- Step 3 Nodes -->
  <g transform="translate(240, 790)">
    <rect fill="#0f172a" stroke="#c084fc" stroke-width="2" width="320" height="60" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500"
       x="160" y="30" text-anchor="middle" dominant-baseline="middle">Hold transcript/challenges fixed</text>
  </g>
  <g transform="translate(240, 880)">
    <rect fill="#0f172a" stroke="#c084fc" stroke-width="2" width="320" height="60" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500"
       x="160" y="30" text-anchor="middle" dominant-baseline="middle">Treat unbound values as variables</text>
  </g>
  <g transform="translate(240, 970)">
    <rect fill="#0f172a" stroke="#c084fc" stroke-width="2" width="320" height="60" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500"
       x="160" y="22" text-anchor="middle" dominant-baseline="middle">Collect the verifier equations</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500"
       x="160" y="42" text-anchor="middle" dominant-baseline="middle">involving them</text>
  </g>

  <!-- Step 4 Nodes -->
  <g transform="translate(240, 1140)">
    <rect fill="#0f172a" stroke="#f472b6" stroke-width="2" width="320" height="60" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500"
       x="160" y="30" text-anchor="middle" dominant-baseline="middle">Set up system of equations</text>
  </g>
  <g transform="translate(240, 1230)">
    <rect fill="#0f172a" stroke="#f472b6" stroke-width="2" width="320" height="60" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500"
       x="160" y="30" text-anchor="middle" dominant-baseline="middle">Solve</text>
  </g>
  <g transform="translate(240, 1320)">
    <rect fill="#0f172a" stroke="#f472b6" stroke-width="2" width="320" height="60" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500"
       x="160" y="30" text-anchor="middle" dominant-baseline="middle">Patch proof with solution</text>
  </g>

  <!-- Final Node: Accept -->
  <g transform="translate(240, 1410)">
    <rect width="320" height="60" rx="30" fill="#065f46" stroke="#34d399" stroke-width="2" />
    <text font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="bold" fill="#ecfdf5"
       x="160" y="31" text-anchor="middle" dominant-baseline="middle">Forged proof verifies!</text>
  </g>
</svg>
