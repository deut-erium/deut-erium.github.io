<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680">
  <defs>
    <marker id="arrow-yellow" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0,-4 L 10,0 L 0,4 Z" fill="#fbbf24" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0,-4 L 10,0 L 0,4 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-red" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0,-4 L 10,0 L 0,4 Z" fill="#ef4444" />
    </marker>
    <marker id="arrow-lime" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0,-4 L 10,0 L 0,4 Z" fill="#a3e635" />
    </marker>
  </defs>

  <!-- Subgraph: Transcript State -->
  <rect fill="#1e293b" fill-opacity="0.3" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,4"
     x="40" y="40" width="260" height="290" rx="12" />
  <text font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1"
     x="60" y="65">TRANSCRIPT STATE</text>

  <!-- Subgraph: NOT in Transcript -->
  <rect fill="#1e293b" fill-opacity="0.3" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"
     x="660" y="40" width="260" height="130" rx="12" />
  <text font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fca5a5" letter-spacing="1"
     x="680" y="65">NOT IN TRANSCRIPT</text>

  <!-- Subgraph: Derived Challenges -->
  <rect fill="#1e293b" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4"
     x="360" y="130" width="260" height="290" rx="12" />
  <text font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1"
     x="380" y="155">DERIVED CHALLENGES</text>

  <!-- Subgraph: Verification -->
  <rect fill="#1e293b" fill-opacity="0.3" stroke="#a3e635" stroke-width="2" stroke-dasharray="6,4"
     x="360" y="480" width="580" height="160" rx="12" />
  <text font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1"
     x="380" y="505">VERIFICATION</text>

  <!-- Arrows -->
  <g fill="none" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 260,115 H 350 V 195 H 390" stroke="#fbbf24" marker-end="url(#arrow-yellow)" />
    <path d="M 260,195 H 330 V 205 H 390" stroke="#fbbf24" marker-end="url(#arrow-yellow)" />
    <path d="M 260,275 H 310 V 215 H 390" stroke="#fbbf24" marker-end="url(#arrow-yellow)" />
    <path d="M 700,115 H 630 V 205 H 590" stroke="#ef4444" stroke-dasharray="6,4" marker-end="url(#arrow-red)" />
    <path d="M 490,230 V 260" stroke="#38bdf8" marker-end="url(#arrow-cyan)" />
    <path d="M 490,310 V 340" stroke="#38bdf8" marker-end="url(#arrow-cyan)" />
    <path d="M 790,140 V 550" stroke="#ef4444" marker-end="url(#arrow-red)" />
    <path d="M 790,460 H 510 V 550" stroke="#ef4444" marker-end="url(#arrow-red)" />
  </g>

  <!-- Edge label -->
  <text font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ef4444" letter-spacing="0.5"
     x="622" y="160" text-anchor="end">independent</text>

  <!-- Node: associated_data -->
  <g transform="translate(80, 90)">
    <rect fill="#1e293b" stroke="#fbbf24" stroke-width="2" width="180" height="50" rx="8" />
    <text font-family="JetBrains Mono, monospace" font-size="14" fill="#cbd5e1" x="90" y="26" text-anchor="middle" dominant-baseline="middle">associated_data</text>
  </g>

  <!-- Node: log_sizes -->
  <g transform="translate(80, 170)">
    <rect fill="#1e293b" stroke="#fbbf24" stroke-width="2" width="180" height="50" rx="8" />
    <text font-family="JetBrains Mono, monospace" font-size="14" fill="#cbd5e1" x="90" y="26" text-anchor="middle" dominant-baseline="middle">log_sizes</text>
  </g>

  <!-- Node: trace commitments -->
  <g transform="translate(80, 250)">
    <rect fill="#1e293b" stroke="#fbbf24" stroke-width="2" width="180" height="50" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500" x="90" y="26" text-anchor="middle" dominant-baseline="middle">trace commitments</text>
  </g>

  <!-- Node: claimed_sum (RED) -->
  <g transform="translate(700, 90)">
    <rect fill="#450a0a" stroke="#c0392b" stroke-width="2" width="180" height="50" rx="8" />
    <text font-family="JetBrains Mono, monospace" font-size="14" fill="#fca5a5" x="90" y="26" text-anchor="middle" dominant-baseline="middle">claimed_sum</text>
  </g>

  <!-- Node: lookup_elements (z) -->
  <g transform="translate(390, 180)">
    <rect fill="#1e293b" stroke="#38bdf8" stroke-width="2" width="200" height="50" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500" x="100" y="26" text-anchor="middle" dominant-baseline="middle"><tspan font-family="JetBrains Mono, monospace" font-size="14" fill="#cbd5e1">lookup_elements</tspan> (<tspan font-family="Georgia, serif" font-style="italic" font-weight="bold" fill="#38bdf8">z</tspan>)</text>
  </g>

  <!-- Node: OODS point -->
  <g transform="translate(390, 260)">
    <rect fill="#1e293b" stroke="#38bdf8" stroke-width="2" width="200" height="50" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500" x="100" y="26" text-anchor="middle" dominant-baseline="middle">OODS point</text>
  </g>

  <!-- Node: composition coeffs -->
  <g transform="translate(390, 340)">
    <rect fill="#1e293b" stroke="#38bdf8" stroke-width="2" width="200" height="50" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500" x="100" y="26" text-anchor="middle" dominant-baseline="middle">composition coeffs</text>
  </g>

  <!-- Node: ∑ claimed_sum == 0 -->
  <g transform="translate(390, 550)">
    <rect fill="#1e293b" stroke="#a3e635" stroke-width="2" width="240" height="60" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500" x="120" y="31" text-anchor="middle" dominant-baseline="middle"><tspan font-family="Georgia, serif" font-style="italic" font-weight="bold" fill="#a3e635" font-size="18">∑</tspan> <tspan font-family="JetBrains Mono, monospace" font-size="14" fill="#cbd5e1">claimed_sum</tspan> <tspan fill="#a3e635" font-family="JetBrains Mono, monospace"> == 0</tspan></text>
  </g>

  <!-- Node: CP(oods) == expected -->
  <g transform="translate(680, 550)">
    <rect fill="#1e293b" stroke="#a3e635" stroke-width="2" width="220" height="60" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#f8fafc" font-weight="500" x="110" y="31" text-anchor="middle" dominant-baseline="middle"><tspan font-family="Georgia, serif" font-style="italic" font-weight="bold" fill="#a3e635">CP</tspan>(<tspan font-family="JetBrains Mono, monospace" font-size="14" fill="#cbd5e1">oods</tspan>) <tspan fill="#a3e635" font-family="JetBrains Mono, monospace"> == expected</tspan></text>
  </g>
</svg>
