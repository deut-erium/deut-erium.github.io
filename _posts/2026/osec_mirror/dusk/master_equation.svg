       font-size="14"
       fill="#f8fafc"
       font-style="italic"
       x="400"
       y="42"
       text-anchor="middle"
       id="text45">F(x) = q_M(x)a(x)b(x) + q_L(x)a(x) + q_R(x)b(x) + q_O(x)c(x) + q_F(x)d(x) + q_C(x)</text>
  </g>
