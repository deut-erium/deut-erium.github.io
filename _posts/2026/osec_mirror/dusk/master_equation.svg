     fill="#94a3b8"
     x="440"
     y="454"
     text-anchor="middle"
     id="text46">If the prover is honest, F(x) = 0 at every row index.</text>
  <text
     font-family="Inter,system-ui,sans-serif"
     font-size="12"
     fill="#ef4444"
     font-weight="600"
     x="440"
     y="476"
     text-anchor="middle"
     id="text47">If the selector evaluations are forged, F(z) = 0 regardless of the witness.</text>
