     font-size="13px"
     font-weight="700"
     fill="#94a3b8"
     letter-spacing="1"
     x="440"
     y="24"
     text-anchor="middle"
     id="text2">THE MASTER EQUATION</text>
  <text
     font-family="Inter,system-ui,sans-serif"
     font-size="12"
     fill="#94a3b8"
     x="440"
     y="44"
     text-anchor="middle"
     id="text3">Every term is one selector polynomial multiplied by witness polynomials. Dusk adds a 4th wire d.</text>
  <!-- Color legend (between subtitle and boxes) -->
  <text
     font-family="Inter,system-ui,sans-serif"
     font-size="10"
     fill="#34d399"
     x="290"
     y="60"
     text-anchor="middle"
     id="text4">■ green = trusted selector (circuit shape)</text>
  <text
     font-family="Inter,system-ui,sans-serif"
     font-size="10"
     fill="#60a5fa"
     x="600"
     y="60"
     text-anchor="middle"
     id="text5">■ blue = untrusted witness (prover data)</text>
  <!-- Row 1: 6 product terms, symmetrically spaced
       Each box is 120w. Total = 6*120 + 5*16 gap = 800. Left margin = (880-800)/2 = 40 -->
  <g
     transform="translate(40,74)"
