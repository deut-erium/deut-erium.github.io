<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200">
  <defs>
    <marker id="arrow-blue" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0,-4 L 10,0 L 0,4 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0,-4 L 10,0 L 0,4 Z" fill="#34d399"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0,-4 L 10,0 L 0,4 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-red" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0,-4 L 10,0 L 0,4 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Title -->
  <text font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1"
     x="360" y="22" text-anchor="middle">DUSK TRANSACTION VERIFICATION</text>

  <!-- Phoenix -->
  <g transform="translate(20, 50)">
    <rect fill="#0f172a" stroke="#38bdf8" stroke-width="2" width="155" height="55" rx="8"/>
    <text font-family="Inter, system-ui, sans-serif" font-size="14" fill="#38bdf8" font-weight="600"
       x="78" y="22" text-anchor="middle" dominant-baseline="middle">Phoenix</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8"
       x="78" y="40" text-anchor="middle" dominant-baseline="middle">(shielded)</text>
  </g>

  <!-- Moonlight -->
  <g transform="translate(20, 125)">
    <rect fill="#0f172a" stroke="#94a3b8" stroke-width="1.5" width="155" height="55" rx="8"/>
    <text font-family="Inter, system-ui, sans-serif" font-size="14" fill="#cbd5e1" font-weight="600"
       x="78" y="22" text-anchor="middle" dominant-baseline="middle">Moonlight</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8"
       x="78" y="40" text-anchor="middle" dominant-baseline="middle">(transparent)</text>
  </g>

  <!-- PLONK verifier (vulnerability) -->
  <g transform="translate(260, 42)">
    <rect fill="#450a0a" stroke="#c0392b" stroke-width="2" width="210" height="70" rx="8"/>
    <text font-family="JetBrains Mono, monospace" font-size="11" fill="#fca5a5" font-weight="500"
       x="105" y="27" text-anchor="middle" dominant-baseline="middle">verify_proof</text>
    <text font-family="JetBrains Mono, monospace" font-size="11" fill="#fca5a5" font-weight="500"
       x="105" y="47" text-anchor="middle" dominant-baseline="middle">_with_version()</text>
  </g>

  <!-- BLS verifier -->
  <g transform="translate(260, 125)">
    <rect fill="#0f172a" stroke="#34d399" stroke-width="2" width="210" height="55" rx="8"/>
    <text font-family="Inter, system-ui, sans-serif" font-size="14" fill="#34d399" font-weight="500"
       x="105" y="28" text-anchor="middle" dominant-baseline="middle">BLS verification</text>
  </g>

  <!-- Mempool -->
  <g transform="translate(565, 82)">
    <rect fill="#0f172a" stroke="#60a5fa" stroke-width="2" width="130" height="55" rx="8"/>
    <text font-family="Inter, system-ui, sans-serif" font-size="14" fill="#f8fafc" font-weight="500"
       x="65" y="28" text-anchor="middle" dominant-baseline="middle">Mempool</text>
  </g>

  <!-- Arrows -->
  <g fill="none" stroke-width="2.5" stroke-linejoin="round">
    <!-- Phoenix -> PLONK -->
    <path d="M 175,78 H 260" stroke="#38bdf8" marker-end="url(#arrow-blue)"/>
    <!-- Moonlight -> BLS -->
    <path d="M 175,152 H 260" stroke="#94a3b8" marker-end="url(#arrow-dim)"/>
    <!-- PLONK -> Mempool (dashed - vulnerable path) -->
    <path d="M 470,77 H 530 V 105 H 565" stroke="#ef4444" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
    <!-- BLS -> Mempool -->
    <path d="M 470,152 H 530 V 115 H 565" stroke="#34d399" marker-end="url(#arrow-green)"/>
  </g>

  <!-- Edge labels -->
  <text font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8"
     x="218" y="72" text-anchor="middle">PLONK proof</text>
  <text font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8"
     x="218" y="146" text-anchor="middle">BLS sig</text>
</svg>
