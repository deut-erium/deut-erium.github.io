<script>
(() => {
  'use strict';

  const root = document.documentElement;
  root.classList.add('js');
  const colorKey = 'deuterium-theme';
  const skinKey = 'deuterium-skin';
  const defaultSkin = 'rpn-garden';
  const skinBase = {{ '/assets/css/skins/' | relative_url | jsonify }};
  const skinFiles = {
    {%- for theme in site.data.themes -%}
      {%- unless theme.default -%}
        {%- assign skin_number = forloop.index0 | prepend: '0' | slice: -2, 2 -%}
        {%- assign skin_file = skin_number | append: '-' | append: theme.id | append: '.css' -%}
        {%- assign skin_path = '/assets/css/skins/' | append: skin_file -%}
        {%- assign skin_hash = skin_path | asset_v -%}
        {%- assign skin_href_entry = skin_path | append: '?v=' | append: skin_hash -%}
        {{ theme.id | jsonify }}: {{ skin_href_entry | jsonify }}{% unless forloop.last %},{% endunless %}
      {%- endunless -%}
    {%- endfor -%}
  };
  const read = (key) => {
    try {
      return localStorage.getItem(key);
    } catch (_) {
      return null;
    }
  };
  const save = (key, value) => {
    try {
      localStorage.setItem(key, value);
    } catch (_) {
      // The selected state still applies to this page.
    }
  };

  let requestedSkin = null;
  try {
    requestedSkin = new URLSearchParams(location.search).get('skin');
  } catch (_) {
    // An invalid query falls back to the saved selection.
  }

  const hasSkin = (id) => Object.prototype.hasOwnProperty.call(skinFiles, id);
  const savedSkin = read(skinKey);
  const skin = hasSkin(requestedSkin)
    ? requestedSkin
    : requestedSkin === defaultSkin
      ? defaultSkin
      : hasSkin(savedSkin)
        ? savedSkin
        : defaultSkin;
  if (requestedSkin === defaultSkin || hasSkin(requestedSkin)) {
    save(skinKey, skin);
  }

  const systemDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const savedColor = read(colorKey);
  const color = savedColor === 'dark' || savedColor === 'light'
    ? savedColor
    : systemDark ? 'dark' : 'light';

  root.dataset.theme = color;
  if (skin === defaultSkin) delete root.dataset.skin;
  else root.dataset.skin = skin;

  const skinHref = skin === defaultSkin ? null : skinBase + skinFiles[skin];
  const syncControls = () => {
    const button = document.querySelector('.theme-toggle');
    if (button) {
      const dark = color === 'dark';
      button.hidden = false;
      button.setAttribute('aria-pressed', String(dark));
      button.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
    }
    const picker = document.querySelector('#skin-picker');
    if (picker) picker.value = skin;
    const option = picker?.querySelector('option[value="' + skin + '"]');
    const summary = document.querySelector('.skin-menu summary');
    if (summary && option) summary.textContent = 'Theme: ' + option.textContent;
  };
  window.__deuteriumTheme = { colorKey, skinKey, defaultSkin, skinFiles, skinBase, skin, skinHref, syncControls };

  if (skinHref) {
    document.write('<link rel="preload" as="style" href="' + skinHref + '">');
    {%- assign bootstrap_path = '/assets/js/theme-bootstrap.js' -%}
    {%- assign bootstrap_version = '/' | asset_v -%}
    {%- assign bootstrap_src = bootstrap_path | relative_url | append: '?v=' | append: bootstrap_version -%}
    const bootstrap = document.createElement('script');
    bootstrap.src = {{ bootstrap_src | jsonify }};
    bootstrap.defer = true;
    document.head.appendChild(bootstrap);
  }
})();
</script>
