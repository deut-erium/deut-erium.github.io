{%- if page.publication -%}
<details class="publication-cite">
  <summary class="action publication-cite__toggle">Cite</summary>
  <div class="publication-cite__panel">
    <p class="publication-cite__hint">Copy this citation into your bibliography, or download the BibTeX file.</p>
    {%- if page.publication.date_note -%}<p class="publication-cite__note">{{ page.publication.date_note | escape }}</p>{%- endif -%}
    <label class="publication-cite__field">BibTeX<textarea readonly rows="9" cols="72" spellcheck="false">{{ page.publication.bibtex | escape }}</textarea></label>
    <a class="publication-cite__download" href="{{ page.publication.bib_url | relative_url | escape }}" type="application/x-bibtex" download>Download .bib</a>
  </div>
</details>
{%- if site.academic_pdfs == true -%}
<a class="publication-pdf" href="{{ page.publication.pdf_url | relative_url | escape }}" type="application/pdf">PDF</a>
{%- endif -%}
{%- endif -%}
