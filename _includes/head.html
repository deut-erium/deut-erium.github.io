<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">

{%- if page.layout == 'home' -%}
  <title>{{ site.title }}</title>
{%- elsif page.title -%}
  <title>{{ page.title }} / {{ site.title }}</title>
{%- else -%}
  <title>{{ site.title }}</title>
{%- endif -%}

{%- seo title=false -%}
{%- if page.noindex -%}<meta name="robots" content="noindex, follow">{%- endif -%}
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<meta name="theme-color" content="#171914" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090c0a" media="(prefers-color-scheme: dark)">
