<footer class="site-footer">
  <div class="site-footer__inner">
    <p class="site-footer__note">
      {{ site.posts | size }} posts by <a href="{{ site.author.url }}">{{ site.author.name }}</a>.
      Static HTML, local assets, and no tracking.
    </p>
    <nav class="site-footer__links" aria-label="Footer navigation">
      <a href="{{ '/WriteUps/' | relative_url }}">Writeups</a>
      <a href="{{ '/ctf-tutorials/' | relative_url }}">Tutorials</a>
      <a href="{{ '/ramblings/' | relative_url }}">Ramblings</a>
      <a href="https://github.com/{{ site.repository }}">Repository</a>
      <a href="{{ '/feed.xml' | relative_url }}">Atom feed</a>
    </nav>
  </div>
</footer>
