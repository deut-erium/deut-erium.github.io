<link rel="stylesheet" href="{{ '/assets/css/components/site-footer.css' | relative_url }}?v={{ '/assets/css/components/site-footer.css' | asset_v }}">
<footer id="site-footer" class="site-footer" data-toybox-src="{{ '/assets/js/features/toybox.js' | relative_url }}?v={{ '/assets/js/features/toybox.js' | asset_v }}">
  <div class="site-footer__inner">
    <div class="site-footer__contact">
      <p class="site-footer__note">Are you really sure that you want to reach me?</p>
      <nav class="site-footer__links" aria-label="Social and subscription links">
        <a rel="me" href="{{ site.author.github }}">GitHub</a>
        <a rel="me" href="{{ site.author.twitter }}">Twitter</a>
        <a rel="me" href="{{ site.author.linkedin }}">LinkedIn</a>
        <a href="https://discord.com/users/{{ site.author.discord_id }}">Discord</a>
        <a href="mailto:{{ site.author.email }}">Email</a>
        <a href="{{ '/feed.xml' | relative_url }}">Feed</a>
      </nav>
    </div>
    <div class="site-footer__toys" role="group" aria-label="Page toys" aria-describedby="site-footer-toy-status">
      <div class="site-footer__mysteries">
        <button class="site-footer__mystery" type="button" data-toy-slot="0" aria-label="Mystery button 1. Something will happen." aria-pressed="false" disabled>?</button>
        <button class="site-footer__mystery" type="button" data-toy-slot="1" aria-label="Mystery button 2. Something will happen." aria-pressed="false" disabled>?</button>
        <button class="site-footer__mystery" type="button" data-toy-slot="2" aria-label="Mystery button 3. Something will happen." aria-pressed="false" disabled>?</button>
        <span class="site-footer__restore-slot">
          <button class="site-footer__restore" type="button" hidden>put everything back</button>
        </span>
      </div>
      <p id="site-footer-toy-status" class="site-footer__status" role="status" aria-live="polite" aria-atomic="true">Mystery buttons need JavaScript to load.</p>
    </div>
  </div>
</footer>
<script defer src="{{ '/assets/js/footer.js' | relative_url }}?v={{ '/assets/js/footer.js' | asset_v }}"></script>
