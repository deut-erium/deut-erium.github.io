{%- assign _checker_id = page.key | append: '-' | append: index -%}
<form class="flag-check" data-flag-check data-sha256="{{ page.sha256hash[index] }}">
  <label for="flag-{{ _checker_id }}">Enter the flag</label>
  <div class="flag-check__controls">
    <input id="flag-{{ _checker_id }}" data-flag-input type="text" autocomplete="off" autocapitalize="none" spellcheck="false">
    <button type="submit" disabled>Check flag</button>
  </div>
  <output for="flag-{{ _checker_id }}" aria-live="polite">The check runs locally in your browser.</output>
  <noscript>The local SHA-256 checker requires JavaScript. The challenge itself does not.</noscript>
</form>
