name: Site checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          bundler-cache: true
      - name: Build
        env:
          BUNDLE_FROZEN: "true"
          JEKYLL_ENV: production
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          printf 'time: "%s"\n' "$(git show -s --format=%cI HEAD)" > /tmp/jekyll-time.yml
          bundle exec jekyll build --trace --disable-disk-cache \
            --config _config.yml,/tmp/jekyll-time.yml --destination _site
      - name: Verify output
        run: python3 script/verify-site.py _site
