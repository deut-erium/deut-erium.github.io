name: Site checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: 3.3.7
          bundler-cache: true
      - name: Build twice and compare artifacts
        env:
          BUNDLE_FROZEN: "true"
          JEKYLL_ENV: production
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          TZ: Asia/Kolkata
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/site-check"
          rm -rf "$out"
          mkdir -p "$out"
          printf 'time: "%s"\n' "$(git show -s --format=%cI HEAD)" > "$out/time.yml"
          bundle exec jekyll build --trace --disable-disk-cache \
            --config _config.yml,"$out/time.yml" --destination "$out/a"
          bundle exec jekyll build --trace --disable-disk-cache \
            --config _config.yml,"$out/time.yml" --destination "$out/b"
          (cd "$out/a" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$out/a.sha256"
          (cd "$out/b" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$out/b.sha256"
          cmp "$out/a.sha256" "$out/b.sha256"
          python3 script/verify-site.py "$out/a"
