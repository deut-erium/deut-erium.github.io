<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520">
  <defs>
    <marker id="arrow-blue" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0,-4 L 10,0 L 0,4 Z" fill="#60a5fa" />
    </marker>
    <marker id="arrow-yellow" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0,-4 L 10,0 L 0,4 Z" fill="#fbbf24" />
    </marker>
    <marker id="arrow-purple" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0,-4 L 10,0 L 0,4 Z" fill="#c084fc" />
    </marker>
  </defs>

  <g fill="none" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 300,110 V 150" stroke="#60a5fa" marker-end="url(#arrow-blue)" />
    <path d="M 300,230 V 270" stroke="#fbbf24" marker-end="url(#arrow-yellow)" />
    <path d="M 300,350 V 390" stroke="#c084fc" marker-end="url(#arrow-purple)" />
  </g>

  <g transform="translate(120, 40)">
    <rect fill="#1e293b" stroke="#60a5fa" stroke-width="2" width="360" height="70" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="16" fill="#f8fafc" font-weight="600" x="180" y="32" text-anchor="middle" dominant-baseline="middle">zkVM layer</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94a3b8" font-weight="500" x="180" y="52" text-anchor="middle" dominant-baseline="middle">passes claim/value</text>
  </g>

  <g transform="translate(120, 160)">
    <rect fill="#1e293b" stroke="#fbbf24" stroke-width="2" width="360" height="70" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="16" fill="#f8fafc" font-weight="600" x="180" y="32" text-anchor="middle" dominant-baseline="middle">Lookup layer</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94a3b8" font-weight="500" x="180" y="52" text-anchor="middle" dominant-baseline="middle">assumes transcript-bound</text>
  </g>

  <g transform="translate(120, 280)">
    <rect fill="#1e293b" stroke="#c084fc" stroke-width="2" width="360" height="70" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="16" fill="#f8fafc" font-weight="600" x="180" y="32" text-anchor="middle" dominant-baseline="middle">Sumcheck layer</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94a3b8" font-weight="500" x="180" y="52" text-anchor="middle" dominant-baseline="middle">assumes transcript-bound</text>
  </g>

  <g transform="translate(90, 400)">
    <rect fill="#450a0a" stroke="#ef4444" stroke-width="2" width="420" height="70" rx="8" />
    <text font-family="Inter, system-ui, sans-serif" font-size="16" fill="#fca5a5" font-weight="700" x="210" y="32" text-anchor="middle" dominant-baseline="middle">Claim falls through:</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="15" fill="#fca5a5" font-weight="500" x="210" y="52" text-anchor="middle" dominant-baseline="middle">unbound value reaches verifier</text>
  </g>

</svg>
