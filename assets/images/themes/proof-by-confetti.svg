<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" fill="none">
  <title>Cut-paper mobile</title>
  <desc>A bent wire balances a melon oval loop, a butter wedge and a turquoise disc. A separate compact view leaves out the suspension threads.</desc>
  <view id="dark" viewBox="1000 0 360 420"/>
  <view id="compact" viewBox="500 0 360 112"/>
  <!-- The suspension stops above each paper edge. -->
  <g stroke="#35134f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path id="piece-1" d="M191 3L191 43M51 98Q182 33 315 83"/>
    <path id="piece-2" d="M60 96L60 130M312 85L312 233M175 67L175 246"/>
    <path id="piece-3" d="M184 46Q191 36 198 46Q200 54 192 58Q182 57 184 46Z" fill="#e0fbef"/>
  </g>
  <!-- An open, uneven oval cut from melon paper; the inner contour is not concentric. -->
  <path id="piece-4" d="M106 154C79 122 36 130 19 169C-3 219 21 269 61 274C101 280 133 240 127 195L102 199C105 229 88 252 64 249C38 246 25 217 40 185C52 159 76 153 90 175Z" fill="#ff83bd" stroke="#35134f" stroke-width="1.5" stroke-linejoin="round"/>
  <path id="piece-5" d="M31 175C12 215 28 256 60 263M101 156L92 169" stroke="#35134f" stroke-width="1.2" stroke-linecap="round"/>
  <!-- A bowed wedge with a rolled corner and a hand-cut curved base. -->
  <path id="piece-6" d="M171 260C179 249 192 252 200 264L255 350C266 370 257 386 235 389L128 400C109 402 98 390 106 372Z" fill="#ffb782" stroke="#35134f" stroke-width="1.5"/>
  <path id="piece-7" d="M119 385Q164 383 219 376M173 264L117 371" stroke="#35134f" stroke-width="1.2" stroke-linecap="round"/>
  <path id="piece-8" d="M236 389Q246 379 244 369Q257 376 252 383" fill="#e0fbef" stroke="#35134f" stroke-width="1.2"/>
  <!-- The off-center hanging disc is narrower at its upper edge. -->
  <path id="piece-9" d="M307 248C329 241 350 262 349 286C349 313 328 334 304 332C278 330 266 308 272 284C276 264 291 252 307 248Z" fill="#00ac9e" stroke="#35134f" stroke-width="1.5"/>
  <path id="piece-10" d="M312 256L312 265M282 300Q286 321 305 322" stroke="#35134f" stroke-width="1.2" stroke-linecap="round"/>
  <circle id="piece-11" cx="312" cy="270" r="3" fill="#e0fbef" stroke="#35134f" stroke-width="1.2"/>
  <g transform="translate(1000 0)" stroke="#bceee0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <use href="#piece-1"/>
    <use href="#piece-2"/>
    <use href="#piece-3"/>
    <use href="#piece-4"/>
    <use href="#piece-5"/>
    <use href="#piece-6"/>
    <use href="#piece-7"/>
    <use href="#piece-8"/>
    <use href="#piece-9"/>
    <use href="#piece-10"/>
    <use href="#piece-11"/>
  </g>
  <!-- Small-screen paper only, in a horizontal arrangement. -->
  <g transform="translate(500 0)" stroke="#35134f" stroke-width="1.4" stroke-linejoin="round">
    <path d="M73 18C43 1 11 19 10 51C9 83 38 107 70 97C96 89 108 63 96 37L79 46C85 63 77 77 63 80C43 87 27 71 29 52C29 33 49 22 63 34Z" fill="#ff83bd"/>
    <path d="M180 17Q190 5 201 22L253 85Q264 103 241 103L140 103Q120 102 132 84Z" fill="#ffb782"/>
    <path d="M143 93L234 93M179 28L145 78" stroke-linecap="round"/>
    <path d="M314 26C338 24 350 41 347 61C344 83 322 98 303 87C282 75 283 48 298 34Q305 27 314 26Z" fill="#00ac9e"/>
    <path d="M297 65Q300 80 315 81" stroke-linecap="round"/>
  </g>
</svg>
