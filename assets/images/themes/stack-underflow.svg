<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" preserveAspectRatio="none">
  <title>Paper roller, curled edge and perforation stencil</title>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#35a9df"/>
      <stop offset=".22" stop-color="#b4edff"/>
      <stop offset=".43" stop-color="#64ceff"/>
      <stop offset=".77" stop-color="#52c9f5"/>
      <stop offset="1" stop-color="#1688c8"/>
    </linearGradient>
    <linearGradient id="end" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1688c8"/>
      <stop offset=".5" stop-color="#b4edff"/>
      <stop offset="1" stop-color="#35a9df"/>
    </linearGradient>
    <pattern id="holes" width="20" height="8" patternUnits="userSpaceOnUse">
      <rect x="7" y="2" width="6" height="3" rx="1.5" fill="black"/>
    </pattern>
    <mask id="tear"><rect width="1000" height="8" fill="white"/><rect width="1000" height="8" fill="url(#holes)"/></mask>
  </defs>
  <view id="roller" viewBox="0 0 1000 160" preserveAspectRatio="none"/>
  <view id="curl" viewBox="0 180 1000 60"/>
  <view id="perforation" viewBox="0 260 1000 8"/>
  <g stroke="#295285" stroke-width="1.5">
    <rect x="18" y="8" width="964" height="144" rx="65" fill="url(#metal)"/>
    <ellipse cx="48" cy="80" rx="34" ry="70" fill="url(#end)"/>
    <ellipse cx="952" cy="80" rx="34" ry="70" fill="url(#end)"/>
    <ellipse cx="48" cy="80" rx="21" ry="53" fill="none"/>
    <ellipse cx="952" cy="80" rx="21" ry="53" fill="none"/>
    <path d="M88 132H912" stroke="#b71442" stroke-width="4"/>
    <path d="M89 128H911" stroke="#ffec68" stroke-width="3"/>
  </g>
  <path d="M0 193Q20 180 60 180H940Q977 180 1000 193V228Q975 211 940 214H60Q20 212 0 234Z" fill="black"/>
  <g transform="translate(0 260)"><rect width="1000" height="8" fill="black" mask="url(#tear)"/></g>
</svg>
