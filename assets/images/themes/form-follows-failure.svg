<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" fill="none">
  <title>Six balanced theatre pieces</title>
  <desc>Two tangent discs sit on a lever above a half-disc cradle, with a triangular fulcrum and a counterweight at its other end.</desc>
  <!-- Ochre cradle; the white inset is a cut through the flat piece. -->
  <g>
    <path d="M28 228H256A114 94 0 0 1 28 228Z" fill="#d79a24"/>
    <path d="M54 241H228" stroke="#fffaef" stroke-width="2"/>
    <path d="M68 255H214" stroke="#fffaef" stroke-width="2"/>
  </g>
  <!-- The two discs touch at x=168, y=142. -->
  <g>
    <circle cx="98" cy="142" r="70" fill="#a93627"/>
    <path d="M98 72V212" stroke="#fffaef" stroke-width="2"/>
    <path d="M98 84A58 58 0 0 1 98 200" stroke="#e5b74d" stroke-width="2"/>
  </g>
  <g>
    <circle cx="211" cy="142" r="43" fill="#e9b94c"/>
    <circle cx="211" cy="142" r="14" fill="#292823"/>
    <path d="M211 99V117M211 167V185" stroke="#292823" stroke-width="2"/>
  </g>
  <!-- A stepped lever makes the differently sized discs share a support. -->
  <g>
    <path d="M20 214H170V187H260V214H417V226H20Z" fill="#292823" stroke="#fffaef" stroke-width="2"/>
    <path d="M177 204H252" stroke="#fffaef" stroke-width="2"/>
  </g>
  <g>
    <path d="M312 228L372 319H252Z" fill="#a93627"/>
    <path d="M312 247L346 302H278Z" stroke="#fffaef" stroke-width="2"/>
  </g>
  <g>
    <path d="M348 214V119H407V214Z" fill="#fffaef" stroke="#292823" stroke-width="2"/>
    <path d="M348 119L407 178V119Z" fill="#d79a24"/>
    <path d="M361 190H393M361 199H393" stroke="#292823" stroke-width="2"/>
  </g>
</svg>
