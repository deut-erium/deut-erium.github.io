    <clipPath id="cyan-cut"><use href="#cyan-sheet"/></clipPath>
    <clipPath id="magenta-cut"><use href="#magenta-sheet"/></clipPath>
  </defs>
  <use href="#cyan-sheet" fill="#00AEC3"/>
  <use href="#magenta-sheet" fill="#ED75AF"/>
  <g clip-path="url(#cyan-cut)">
    <use href="#magenta-sheet" fill="#686597"/>
  </g>
  <use href="#amber-sheet" fill="#E5AB23"/>
  <g clip-path="url(#cyan-cut)">
    <use href="#amber-sheet" fill="#6B9F70"/>
  </g>
  <g clip-path="url(#magenta-cut)">
    <use href="#amber-sheet" fill="#C57058"/>
    <g clip-path="url(#cyan-cut)">
