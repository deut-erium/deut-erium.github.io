<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" fill="none">
  <title>Three die-cut acetate sheets</title>
  <desc>Square-ended cyan, magenta and amber sheets with rounded windows and explicit overprint intersections.</desc>
  <defs>
    <path id="cyan-sheet" fill-rule="evenodd" d="M24 22H1256V346H24ZM234 83C209 83 194 102 194 129V254C194 281 211 300 238 300H1078C1108 300 1126 282 1126 255V129C1126 99 1108 83 1078 83Z"/>
