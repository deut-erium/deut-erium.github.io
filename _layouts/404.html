---
layout: base
---
<main id="content" class="error-shell">
  <div class="error-code" aria-hidden="true"><span>4</span><i></i><span>0</span><i></i><span>4</span></div>
  <p class="eyebrow">404</p>
  <h1>{{ page.title | default: 'Page not found' }}</h1>
  <p>{{ page.description | default: 'The requested page does not exist.' }}</p>
  <nav aria-label="Recovery links">
    <a class="action action--primary" href="{{ '/' | relative_url }}">Return home</a>
    <a class="action" href="{{ '/archive.html' | relative_url }}">Search the archive</a>
  </nav>
  {%- if content != empty -%}<div class="prose error-shell__content">{{ content }}</div>{%- endif -%}
</main>
