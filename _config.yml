url: "https://deut-erium.github.io"
baseurl: ""
title: "deuterium / field notes"
tagline: "Security, cryptography, and strange machinery"
description: >-
  Himanshu Sheoran's notes on security engineering, cryptography, CTFs,
  solvers, reverse engineering, and useful computer behavior.

lang: en
timezone: Asia/Kolkata
future: true

author:
  type: person
  name: deuterium
  url: "https://deut-erium.github.io/"

repository: deut-erium/deut-erium.github.io
repository_tree: master

excerpt_separator: "<!--more-->"
paginate: 8
paginate_path: "/page:num"
feed:
  excerpt_only: true

markdown: kramdown
kramdown:
  input: GFM
  header_offset: 1
highlighter: rouge
permalink: date

exclude:
  - vendor
  - node_modules
  - script
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CONTRIBUTING.md
  - assigments
  - directorize.py
  - .gitignore

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
