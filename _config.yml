url: "https://deut-erium.github.io"
baseurl: ""
title: "deuterium's blog"
tagline: "Himanshu Sheoran's blog on tech, security, CTFs and cryptography"
description: >-
  Himanshu Sheoran deut-erium deuterium cryptography Capture The Flag
  CTF hacking cybersecurity SAT SMT solvers and computer science.

lang: en
timezone: Asia/Kolkata
future: true

author:
  type: person
  name: deuterium
  display_name: Himanshu Sheoran
  url: "https://deut-erium.github.io/about.html"
  email: himanshu_sheoran@yahoo.com
  github: "https://github.com/deut-erium"
  twitter: "https://twitter.com/0xdeuterium"
  linkedin: "https://www.linkedin.com/in/himanshu-sheoran-ab047b152"

repository: deut-erium/deut-erium.github.io
repository_tree: master

# Privacy-friendly visitor counts via GoatCounter (https://www.goatcounter.com).
# Set this to your GoatCounter site code, e.g. "example" for
# https://example.goatcounter.com, to enable one async script plus a no-JS
# counting pixel on every Jekyll page. An empty string keeps the site free of
# third-party requests. script/verify-site.py enforces whichever state is set:
# disabled means zero occurrences anywhere; enabled means exactly one script
# and one pixel on every regular page and none on redirect pages.
goatcounter_site: "deuterium"

excerpt_separator: "<!--more-->"
paginate: 8
paginate_path: "/page:num"
feed:
  excerpt_only: true

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  header_offset: 1
highlighter: rouge
permalink: date

exclude:
  - agent_out
  - vendor
  - _legacy_blobs
  - node_modules
  - script
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - LICENSE
  - README.md
  - CONTRIBUTING.md
  - assigments
  - directorize.py
  - .gitignore

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
  - scope:
      path: "_posts/WriteUps"
      type: posts
    values:
      layout: writeup
  - scope:
      path: "assets/resume.pdf"
    values:
      sitemap: false

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-postfiles
  - jekyll-seo-tag
  - jekyll-sitemap
