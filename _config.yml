url: "https://deut-erium.github.io"
baseurl: ""
title: "deuterium's blog"
tagline: "Himanshu Sheoran's blog on tech, security, CTFs and cryptography"
description: >-
  Himanshu Sheoran deut-erium deuterium cryptography Capture The Flag
  CTF hacking cybersecurity SAT SMT solvers and computer science.

lang: en
timezone: Asia/Kolkata
future: true

author:
  type: person
  name: deuterium
  url: "https://deut-erium.github.io/"

repository: deut-erium/deut-erium.github.io
repository_tree: master

excerpt_separator: "<!--more-->"
paginate: 8
paginate_path: "/page:num"
feed:
  excerpt_only: true

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  header_offset: 1
highlighter: rouge
permalink: date

exclude:
  - agent_out
  - vendor
  - _legacy_blobs
  - _legacy_authored
  - node_modules
  - node_modules
  - script
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - LICENSE
  - README.md
  - CONTRIBUTING.md
  - assigments
  - directorize.py
  - .gitignore

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: article
  - scope:
      path: "_posts/WriteUps"
      type: posts
    values:
      layout: writeup
  - scope:
      path: "assets/resume.pdf"
    values:
      sitemap: false

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-postfiles
  - jekyll-seo-tag
  - jekyll-sitemap
